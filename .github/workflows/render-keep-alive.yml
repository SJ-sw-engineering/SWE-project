name: Render keep alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request backend health endpoint
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        shell: bash
        run: |
          if [[ -z "$RENDER_HEALTH_URL" ]]; then
            echo "::error::Set the repository variable RENDER_HEALTH_URL to your Render HTTPS URL ending in /health."
            exit 1
          fi
          curl --fail --show-error --silent \
            --proto '=https' \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-max-time 180 \
            "$RENDER_HEALTH_URL"
